<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password – IAST Quality Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy: #0d2b45;
      --navy-mid: #163a5f;
      --navy-light: #204b78;
      --teal: #00aabb;
      --teal-hover: #008899;
      --off-white: #f5f7fa;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --font-main: 'Barlow', sans-serif;
      --font-head: 'Barlow Condensed', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main);
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      overflow: hidden;
      border-top: 5px solid var(--teal);
    }
    .card-header {
      background: var(--navy);
      padding: 30px 24px;
      text-align: center;
      color: #fff;
    }
    .card-header h1 {
      font-family: var(--font-head);
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .card-header p {
      font-size: 0.88rem;
      color: rgba(255,255,255,0.7);
    }
    .card-body { padding: 32px 28px; }
    .alert {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .alert-danger { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px;
    }
    .input-wrapper { position: relative; width: 100%; }
    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: var(--font-main);
      color: var(--text-dark);
    }
    .form-control:focus {
      outline: none;
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0, 170, 187, 0.15);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: var(--font-head);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover { background: var(--teal-hover); }
    .back-login {
      display: block;
      text-align: center;
      margin-top: 18px;
      font-size: 0.85rem;
      color: var(--navy-mid);
      font-weight: 600;
      text-decoration: none;
    }
    .back-login:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <i class="fas fa-lock" style="font-size: 2.5rem; color: var(--teal); margin-bottom: 10px;"></i>
      <h1>RESET PASSWORD</h1>
      <p>IAST Quality Management System</p>
    </div>
    <div class="card-body">
      <div id="msgAlert" class="alert" style="display:none;"></div>
      <form id="resetForm" onsubmit="submitReset(event)">
        <input type="hidden" id="token"/>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="input-wrapper">
            <i class="fas fa-key"></i>
            <input type="password" id="newPassword" class="form-control" placeholder="Enter new password" required minlength="8"/>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <div class="input-wrapper">
            <i class="fas fa-check-double"></i>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm new password" required minlength="8"/>
          </div>
        </div>
        <button type="submit" id="btnSubmit" class="btn-submit">
          <i class="fas fa-save"></i> Save New Password
        </button>
      </form>
      <a href="/admin/login" class="back-login"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      if (!token) {
        const alertBox = document.getElementById('msgAlert');
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'flex';
        alertBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> <span>Password reset token is missing or invalid.</span>';
        document.getElementById('resetForm').style.display = 'none';
        return;
      }
      document.getElementById('token').value = token;
    });

    async function submitReset(e) {
      e.preventDefault();
      const token = document.getElementById('token').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const alertBox = document.getElementById('msgAlert');
      const btn = document.getElementById('btnSubmit');

      if (newPassword !== confirmPassword) {
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'flex';
        alertBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> <span>New password and confirm password do not match.</span>';
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

      try {
        const res = await fetch('/api/public/admin/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword, confirmPassword })
        });
        const data = await res.json();
        if (res.ok) {
          alertBox.className = 'alert alert-success';
          alertBox.style.display = 'flex';
          alertBox.innerHTML = '<i class="fas fa-check-circle admin-alert__icon"></i><div class="admin-alert__content"><div class="admin-alert__title">Password reset successfully</div><div class="admin-alert__body">Redirecting to login...</div></div>';
          document.getElementById('resetForm').style.display = 'none';
          setTimeout(() => { window.location.href = '/admin/login'; }, 2500);
        } else {
          alertBox.className = 'alert alert-danger';
          alertBox.style.display = 'flex';
          alertBox.innerHTML = '<i class="fas fa-times-circle admin-alert__icon"></i><div class="admin-alert__content"><div class="admin-alert__title">Password reset failed</div><div class="admin-alert__body">' + (data.message || 'Please check your input and try again.') + '</div></div>';
        }
      } catch (err) {
        alertBox.className = 'alert alert-danger';
        alertBox.style.display = 'flex';
        alertBox.innerHTML = '<i class="fas fa-times-circle admin-alert__icon"></i><div class="admin-alert__content"><div class="admin-alert__title">Something went wrong</div><div class="admin-alert__body">Please try again.</div></div>';
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-save"></i> Save New Password';
      }
    }
  </script>
</body>
</html>

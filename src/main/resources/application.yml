server:
  port: ${PORT:${SERVER_PORT:8093}}
  ssl:
    enabled: ${SSL_ENABLED:false}
    bundle: my-server-bundle
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${server.ssl.enabled:${SSL_ENABLED:false}}
        same-site: Lax

spring:
  ssl:
    bundle:
      pem:
        my-server-bundle:
          keystore:
            certificate: ${SSL_CERTIFICATE:}
            private-key: ${SSL_CERTIFICATE_PRIVATE_KEY:}

  devtools:
    restart:
      exclude: static/**,public/**,templates/**,META-INF/maven/**,META-INF/resources/**,data/**,uploaded-documents/**
      poll-interval: 3s
      quiet-period: 2s
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/quality_website?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  base-url: ${APP_BASE_URL:https://localhost:8093}
  upload:
    dir: ${UPLOAD_DIR:./uploaded-documents}
  feedback:
    recipients: ${FEEDBACK_RECIPIENTS:admin@example.com}
    from-email: ${FEEDBACK_FROM_EMAIL:admin@example.com}
    from-name: ${FEEDBACK_FROM_NAME:IAST Quality Portal}
    email-subject: ${FEEDBACK_EMAIL_SUBJECT:New Feedback Received}